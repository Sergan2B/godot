[package]
name = "codex-storage-spike"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["sqlite", "segment"]
sqlite = ["dep:rusqlite"]
segment = []

[dependencies]
godot-codex-index-store = { path = "../../../godot-codex-mcp/crates/index-store" }
rusqlite = { version = "0.39.0", features = ["bundled"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.17"

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "allow"
